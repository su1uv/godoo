version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/platform/db/sql/queries"
    schema: "migrations"
    gen:
      go:
        package: "db"
        out: "internal/platform/db/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: false
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
            nullable: true
          - db_type: "uuid"
            go_type: "uuid.UUID"
            nullable: true
